name: ConecteMaxHub
options:
  bundleIdPrefix: br.com.conectemax
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_KEY_CFBundleDisplayName: Conecte Max Hub
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
targets:
  ConecteMaxHub:
    type: application
    platform: iOS
    sources: [ConecteMaxHub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.conectemax.hub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Configuration/Info.plist
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          INFOPLIST_FILE: Configuration/Info-Debug.plist
  ConecteMaxHubTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ConecteMaxHubTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ConecteMaxHub
schemes:
  ConecteMaxHub:
    build:
      targets:
        ConecteMaxHub: all
    test:
      targets: [ConecteMaxHubTests]
